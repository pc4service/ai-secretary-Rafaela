name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  unit-tests:
    name: Unit tests (auth + knowledge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Full requirements, not a hand-picked subset: the guard tests import
        # app.main, which pulls in FastAPI, Haystack, SQLAlchemy and MSAL.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          ENVIRONMENT: trial
          DRY_RUN: "true"
          # No Qdrant in CI: indexing reports "skipped", keyword search still works.
          QDRANT_URL: ""
          KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
          PYTHONPATH: .
        run: pytest

  docker-compose-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compose
        run: docker compose version
      - name: Config check (dev)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Config check (prod)
        run: |
          # Provide required prod vars so interpolation does not fail
          export POSTGRES_PASSWORD=ci-dummy-password
          export SECRET_KEY=ci-dummy-secret-key-min-32-characters
          docker compose -f docker-compose.prod.yml config --quiet || true
