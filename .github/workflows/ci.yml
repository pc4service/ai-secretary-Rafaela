name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit tests (auth + knowledge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pydantic-settings python-jose cryptography httpx structlog

      - name: Run unit tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          ENVIRONMENT: trial
          DRY_RUN: "true"
          REQUIRE_AUTH: "true"
          QDRANT_URL: ""
          KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
          PYTHONPATH: .
        run: pytest -q tests/

  docker-compose-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compose
        run: docker compose version
      - name: Config check (dev)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Config check (prod)
        run: |
          # Provide required prod vars so interpolation does not fail
          export POSTGRES_PASSWORD=ci-dummy-password
          export SECRET_KEY=ci-dummy-secret-key-min-32-characters
          docker compose -f docker-compose.prod.yml config --quiet || true
