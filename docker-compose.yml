version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: secretary-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://secretary:secretary@db:5432/secretary
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=trial
      - DRY_RUN=true
    volumes:
      - ./backend/app:/app/app  # hot-reload for development
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - secretary-net

  db:
    image: postgres:16-alpine
    container_name: secretary-db
    environment:
      POSTGRES_USER: secretary
      POSTGRES_PASSWORD: secretary
      POSTGRES_DB: secretary
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - secretary-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: secretary-redis
    ports:
      - "6379:6379"
    networks:
      - secretary-net
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: secretary-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    depends_on:
      - backend
    networks:
      - secretary-net
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  secretary-net:
    driver: bridge
